
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --paper: #f3eadb;
    --ink: #241d18;
    --rust: #a65035;
    --gold: #c59a5b;
    --muted: #86786a;
    --line: rgba(54,40,29,.25);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow-x: hidden;
    transition: background .4s, color .4s;
}

/* DARK MODE */

body.dark {
    --paper: #211b17;
    --ink: #f3eadb;
    --rust: #d17b5c;
    --gold: #c59a5b;
    --muted: #ad9c88;
    --line: rgba(237,222,202,.25);
}

/* TOP BAR */

.topbar {
    height: 72px;
    padding: 0 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
}

.brand {
    font: 500 12px var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
}

.theme-toggle {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 19px;
    cursor: pointer;
    transition: .3s;
}

.theme-toggle:hover {
    background: var(--ink);
    color: var(--paper);
    transform: rotate(20deg);
}

/* INTRO */

.intro {
    text-align: center;
    padding: 65px 20px 35px;
}

.intro small {
    color: var(--rust);
    font: 10px var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
}

.intro h1 {
    font: 500 clamp(42px, 7vw, 76px)/1.1 var(--serif);
    letter-spacing: -.045em;
    margin: 17px 0 12px;
}

.intro p {
    color: var(--muted);
    font-size: 13px;
}

/* BUTTON GRID */

.button-grid {
    width: min(1050px, 90%);
    margin: 30px auto 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 45px 35px;
}

/* WAVY FLOATING BUTTON */

.nav-link {
    position: relative;
    min-height: 155px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

    color: var(--ink);
    text-decoration: none;
    font: 500 clamp(20px, 2.5vw, 27px) var(--serif);

    isolation: isolate;
    animation: float 8s ease-in-out infinite;
    animation-delay: var(--delay);
    transition: color .3s;
}

/* Thin wavy border */

.nav-link::before {
    content: "";
    position: absolute;
    inset: 5px;
    z-index: -1;
    border: 1px solid var(--rust);
    border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
    animation: wave 9s ease-in-out infinite;
    animation-delay: var(--delay);
    transition: border-color .3s, box-shadow .3s;
}

.nav-link::after {
    content: "";
    position: absolute;
    inset: 13px;
    z-index: -1;
    border: 1px solid var(--gold);
    border-radius: 55% 45% 42% 58% / 45% 55% 45% 55%;
    opacity: .55;
    animation: wave 12s ease-in-out infinite reverse;
    animation-delay: var(--delay);
}

.nav-link:hover {
    color: var(--rust);
}

.nav-link:hover::before {
    box-shadow: 0 0 25px rgba(166,80,53,.16);
    border-color: var(--gold);
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-9px) rotate(1deg); }
}

@keyframes wave {
    0%, 100% {
        border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
    }
    33% {
        border-radius: 55% 45% 42% 58% / 55% 48% 52% 45%;
    }
    66% {
        border-radius: 47% 53% 60% 40% / 42% 58% 42% 58%;
    }
}

/* FOOTER */

footer {
    text-align: center;
    padding: 25px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font: 9px var(--mono);
    letter-spacing: .15em;
}

/* MOBILE */

@media (max-width: 600px) {
    .intro { padding-top: 48px; }

    .button-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 25px 12px;
        width: 92%;
    }

    .nav-link {
        min-height: 135px;
        font-size: 19px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="brand">THE PLAYBOOK</div>

    <button class="theme-toggle" id="themeToggle"
            aria-label="Toggle dark mode">☾</button>
</header>

<section class="intro">
    <h1>Explore</h1>
</section>

<main class="button-grid" id="buttonGrid"></main>

<footer>
    RUDRA SURATI
</footer>

<script>

/* EDIT ONLY THIS LIST */

const collections = [
    { name: "The Manipulation", file: "Manipulation.html" },
    { name: "Board Exam 10th", file: "BTT.html" },
];


/* AUTOMATIC LINK GENERATION */

const grid = document.getElementById("buttonGrid");

collections.forEach((item, index) => {
    const link = document.createElement("a");

    link.className = "nav-link";
    link.href = item.file;
    link.textContent = item.name;

    link.style.setProperty(
        "--delay",
        `${index * -1.3}s`
    );

    grid.appendChild(link);
});


/* DARK MODE */

const toggle = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    toggle.textContent = "☀";
}

toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");

    toggle.textContent = isDark ? "☀" : "☾";

    localStorage.setItem("theme", isDark ? "dark" : "light");
});

</script>

</body>
</html>
